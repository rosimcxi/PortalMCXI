name: PortalMCXI backend baseline

on:
  push:
    branches:
      - "work/backend-baseline-and-infohub-v1"
    paths:
      - "backend/**"
      - ".env.example"
      - ".github/workflows/backend-baseline.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".env.example"
      - ".github/workflows/backend-baseline.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exact source identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet build             backend/PortalMCXIBackend/PortalMCXIBackend.csproj             -c Release             --nologo

      - name: Smoke backend routes
        shell: bash
        env:
          PORTAL_LOCATION_NAME: "CI fixture"
          PORTAL_LOCATION_LAT: "50.0755"
          PORTAL_LOCATION_LON: "14.4378"
          PORTAL_TIMEZONE: "Europe/Prague"
          PORTAL_BIRTH_DATE: "2000-01-01"
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/portal-api.log"

          dotnet run             --project backend/PortalMCXIBackend/PortalMCXIBackend.csproj             -c Release             --no-build             --urls http://127.0.0.1:5099             >"$log" 2>&1 &

          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5099/ >/tmp/root.txt; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            cat "$log"
            exit 20
          fi

          grep -F "PortalMCXI API is running" /tmp/root.txt

          curl -fsS http://127.0.0.1:5099/system >/tmp/system.json
          curl -fsS "http://127.0.0.1:5099/api/esoterika/kondiciogram?birthDateStr=2000-01-01" >/tmp/kondiciogram.json
          curl -fsS http://127.0.0.1:5099/api/casna/dashboard >/tmp/casna.json
          curl -fsS http://127.0.0.1:5099/api/info/morning >/tmp/morning.json

          python3 - <<'PY'
          import json

          system = json.load(open("/tmp/system.json", encoding="utf-8"))
          kond = json.load(open("/tmp/kondiciogram.json", encoding="utf-8"))
          casna = json.load(open("/tmp/casna.json", encoding="utf-8"))
          morning = json.load(open("/tmp/morning.json", encoding="utf-8"))

          assert system["status"] == "Online"
          assert isinstance(kond["physical"], (int, float))
          assert isinstance(casna["projects"], list)
          assert isinstance(casna["tasks"], list)
          assert morning["location"]["name"] == "CI fixture"
          assert morning["overallStatus"] in {"OK", "PARTIAL"}
          assert morning["finance"] is None or morning["finance"]["source"] == "ČNB"
          if morning["metals"] is not None:
              assert morning["metals"]["source"] == "Gold API"
              assert morning["metals"]["gold"]["symbol"] == "XAU"
              assert morning["metals"]["silver"]["symbol"] == "XAG"
              assert morning["metals"]["gold"]["czkPerGram"] > 0
              assert morning["metals"]["silver"]["czkPerGram"] > 0
          if morning["weather"] is not None:
              assert morning["weather"]["source"] == "Open-Meteo"
          if morning["sun"] is not None:
              assert morning["sun"]["source"] == "Open-Meteo"
          if morning["personal"] is not None:
              assert morning["personal"]["tatva"] is not None
              assert morning["personal"]["numerology"] is not None
              assert morning["personal"]["biorhythm"] is not None
              assert morning["personal"]["status"] == "OK"

          print("BACKEND_BUILD=PASS")
          print("BACKEND_SMOKE=PASS")
          print("MORNING_INFO_ROUTE=PASS")
          print("RFU_CAPACITY_USED=NO")
          print("CONTABO_MUTATION=NO")
          PY
