# =====================================================================
# SOUBOR:   docker-compose.yml
# VERZE:    v3.25
# POPIS:    Opravená produkční verze. API ignoruje "dotnet run" a 
#           staví se čistě přes náš inteligentní Dockerfile.
# =====================================================================

services:
  # Databáze pro portál
  db:
    image: postgres:16-alpine
    container_name: portal_db
    restart: always
    environment:
      POSTGRES_USER: roman_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Nastavte DB_PASSWORD v soukromem prostredi}
      POSTGRES_DB: portal_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - portal_network

  # Backend - .NET 10 API (Produkční sestavení)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORTAL_LOCATION_NAME=${PORTAL_LOCATION_NAME:-}
      - PORTAL_LOCATION_LAT=${PORTAL_LOCATION_LAT:-}
      - PORTAL_LOCATION_LON=${PORTAL_LOCATION_LON:-}
      - PORTAL_TIMEZONE=${PORTAL_TIMEZONE:-Europe/Prague}
      - PORTAL_BIRTH_DATE=${PORTAL_BIRTH_DATE:-}
    depends_on:
      - db
    networks:
      - portal_network
      - npm_network

  # Frontend - sestavený React obsluhovaný Nginxem
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal_frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      - API_UPSTREAM=http://api:5000
    depends_on:
      - api
    networks:
      - portal_network
      - npm_network

volumes:
  db_data:

networks:
  portal_network:
    driver: bridge
  npm_network:
    name: nginx-proxy-manager_default
    external: true
